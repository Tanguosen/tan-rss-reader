name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'

      - name: Install dependencies
        working-directory: tan_rss_mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: tan_rss_mobile
        run: flutter analyze

      - name: Run tests
        working-directory: tan_rss_mobile
        run: flutter test

      - name: Build APK
        working-directory: tan_rss_mobile
        run: flutter build apk --release
