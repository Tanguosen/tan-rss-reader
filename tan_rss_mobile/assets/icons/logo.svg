<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFAF0" />
      <stop offset="100%" stop-color="#FFF2E0" />
    </linearGradient>

    <!-- Warm Glow Effect -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFDAB9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient (Coffee/Brown theme from app) -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2F25" />
      <stop offset="100%" stop-color="#5D4037" />
    </linearGradient>

    <!-- Orange accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#3E2F25" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="220" />
  
  <!-- Glow behind text -->
  <circle cx="512" cy="512" r="400" fill="url(#glow)" />

  <!-- RSS Arc Elements styled elegantly -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Outer Arc -->
    <path d="M 0 512 A 512 512 0 0 1 512 0" fill="none" stroke="url(#accentGradient)" stroke-width="64" stroke-linecap="round" opacity="0.3"/>
    <!-- Inner Arc -->
    <path d="M 0 512 A 340 340 0 0 1 340 172" fill="none" stroke="url(#accentGradient)" stroke-width="64" stroke-linecap="round" opacity="0.6"/>
    <!-- Dot -->
    <circle cx="64" cy="448" r="64" fill="url(#accentGradient)" />
  </g>

  <!-- TAN Text -->
  <text 
    x="512" 
    y="600" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="280" 
    font-weight="900" 
    text-anchor="middle" 
    fill="url(#textGradient)" 
    filter="url(#shadow)"
    letter-spacing="-10"
  >TAN</text>
  
  <!-- RSS Text -->
  <text 
    x="512" 
    y="780" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="120" 
    font-weight="800" 
    text-anchor="middle" 
    fill="url(#accentGradient)" 
    filter="url(#shadow)"
    letter-spacing="20"
  >RSS</text>
</svg>
